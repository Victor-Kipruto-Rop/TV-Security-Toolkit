name: Release package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-sign:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Runner diagnostics
        shell: pwsh
        run: |
          Write-Output "RUNNER_DIAGNOSTIC_START"
          Write-Output "RUNNER_OS=$env:RUNNER_OS"
          Write-Output "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Output "IMAGE_OS=$env:ImageOS"
          Write-Output "POWERSHELL_VERSION=$($PSVersionTable.PSVersion)"
          Get-Date -Format o

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore
        run: dotnet restore TV-Security-Toolkit.sln

      - name: Build Release
        run: dotnet build TV-Security-Toolkit.sln --configuration Release --no-restore

      - name: .NET unit and integration tests
        run: dotnet test TV-Security-Toolkit.sln --configuration Release --no-build

      - name: Python CLI tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests/python -v

      - name: Build and sign USB package
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            throw "Protected signing certificate secrets are required for a release."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "release-signing.pfx"
          $packagePath = Join-Path $env:RUNNER_TEMP "TV-Security-Toolkit-USB"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
            ./scripts/package-usb.ps1 -OutputDirectory $packagePath -SigningCertificatePath $certificatePath -RequireSigned
            ./scripts/verify-package-signatures.ps1 -PackagePath $packagePath
            $archivePath = Join-Path $env:RUNNER_TEMP "TV-Security-Toolkit-USB.zip"
            Compress-Archive -Path (Join-Path $packagePath "*") -DestinationPath $archivePath
            $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  TV-Security-Toolkit-USB.zip" | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt") -Encoding ascii
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
            Remove-Item Env:SIGNING_CERTIFICATE_BASE64 -ErrorAction SilentlyContinue
            Remove-Item Env:SIGNING_CERTIFICATE_PASSWORD -ErrorAction SilentlyContinue
          }

      - name: Upload signed USB package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: TV-Security-Toolkit-USB
          path: |
            ${{ runner.temp }}\TV-Security-Toolkit-USB.zip
            ${{ runner.temp }}\SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}\TV-Security-Toolkit-USB.zip
            ${{ runner.temp }}\SHA256SUMS.txt
          generate_release_notes: true
