name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: windows-2022
    steps:
      - name: Runner diagnostics
        shell: pwsh
        run: |
          Write-Output "RUNNER_DIAGNOSTIC_START"
          Write-Output "RUNNER_OS=$env:RUNNER_OS"
          Write-Output "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Output "IMAGE_OS=$env:ImageOS"
          Write-Output "POWERSHELL_VERSION=$($PSVersionTable.PSVersion)"
          Get-Date -Format o
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore TV-Security-Toolkit.sln
      - name: Unit and integration tests
        run: dotnet test TV-Security-Toolkit.sln --configuration Release --no-restore

  python:
    runs-on: ubuntu-24.04
    steps:
      - name: Runner diagnostics
        shell: bash
        run: |
          echo "RUNNER_DIAGNOSTIC_START"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "IMAGE_OS=$ImageOS"
          date --iso-8601=seconds
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python CLI tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests/python -v
